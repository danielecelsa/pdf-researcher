[project]
name = "pdf-researcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.1.0",
    "flashrank>=0.2.10",
    "langchain==0.3.27",
    "langchain-chroma==0.2.6",
    "langchain-community>=0.3.29",
    "langchain-core>=0.3.76",
    "langchain-google-genai==2.1.10",
    "langgraph==0.6.7",
    "logtail-python>=0.3.4",
    "nest-asyncio>=1.6.0",
    "pymupdf>=1.26.4",
    "pypdf>=6.0.0",
    "python-dotenv>=1.1.1",
    "rank-bm25>=0.2.2",
    "streamlit>=1.49.1",
    "valkey>=6.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["old_files", "bkp", "inspect_db", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# run_eval / generate_golden set os.environ + sys.path before importing (intentional).
"eval/run_eval.py" = ["E402"]
"eval/gate.py" = ["E402"]
"eval/generate_golden.py" = ["E402"]
"eval/push_to_langsmith.py" = ["E402"]
"scripts/smoke_trace.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = [".", "eval"]
testpaths = ["tests"]
