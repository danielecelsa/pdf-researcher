name: CI

# CI runs on branch pushes (fast, cheap checks) and on PRs to main (full gate).
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-eval.txt -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check eval tests agent_core.py helpers.py
      - name: Pytest (unit)
        run: pytest tests -q

  eval-gate-retrieval:
    name: Eval gate — retrieval (recall@5)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-eval.txt
      - name: Build eval corpus
        run: python eval/fetch_corpus.py
      - name: Retrieval gate
        env:
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
        run: python eval/gate.py --mode retrieval --recall-floor 0.40

  eval-gate-generation:
    name: Eval gate — generation (faithfulness)
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-eval.txt
      - name: Build eval corpus
        run: python eval/fetch_corpus.py
      - name: Generation gate
        env:
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
        run: python eval/gate.py --mode generation --recall-floor 0.40 --faithfulness-floor 0.80

  docker-trivy:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pdf-researcher:ci .
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pdf-researcher:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
