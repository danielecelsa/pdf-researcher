name: CI

# On every branch push: lint + tests + retrieval gate + docker/Trivy scan.
# The (paid) generation gate runs on-demand via workflow_dispatch (dispatchable once this
# workflow is on the default branch; until then run it locally: eval/gate.py --mode generation).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  lint-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-eval.txt -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check eval tests agent_core.py helpers.py
      - name: Pytest (unit)
        run: pytest tests -q

  eval-gate-retrieval:
    name: Eval gate — retrieval (recall@5)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-eval.txt
      - name: Build eval corpus
        run: python eval/fetch_corpus.py
      - name: Retrieval gate
        env:
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
        run: python eval/gate.py --mode retrieval --recall-floor 0.40

  eval-gate-generation:
    name: Eval gate — generation (faithfulness)
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-eval.txt
      - name: Build eval corpus
        run: python eval/fetch_corpus.py
      - name: Generation gate
        env:
          GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
        run: python eval/gate.py --mode generation --recall-floor 0.40 --faithfulness-floor 0.80

  docker-trivy:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pdf-researcher:ci .
      # Pinned to the commit behind v0.36.0 rather than @master: a third-party action tracked
      # on a moving branch can run arbitrary code in this pipeline, which is the same supply
      # chain risk the scan below is meant to catch.
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pdf-researcher:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Accepted risks live in .trivyignore.yaml, each with a rationale and an expiry date.
          trivyignores: .trivyignore.yaml
